# Cloudflare Workers の設定(無料プランで動作)
# このファイルに秘密情報は書きません(書く欄もありません)。
# CALIL_APPKEY は Cloudflare の画面(Worker → Settings → Variables and Secrets → Secret)で登録します。
# Web Push の鍵は Worker が初回に自動生成して KV にだけ保存するので、人が扱う必要はありません。
name = "kita-library"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "https://riyonstar.github.io"
BOOKS_URL = "https://riyonstar.github.io/library_checker/books.json"
LIBRARIES_URL = "https://riyonstar.github.io/library_checker/libraries.json"

[[kv_namespaces]]
binding = "KV"
id = "8cc1f3ddd8a64add978495b9ba54538d"

[triggers]
crons = ["30 * * * *"]
