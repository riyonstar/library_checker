name: check
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 秘密情報の直書きチェック
        run: node check-secrets.mjs
      - name: 単体テスト
        run: node test-worker.mjs
